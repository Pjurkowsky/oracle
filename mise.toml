[tools]
uv = "0.13.4"

[tasks.evaluate]
description = "Evaluate card recognition checkpoints."
run = "uv run --no-sync python -m cardid.evaluate"

[tasks.export]
description = "Export and verify an ONNX bundle."
run = "uv run --no-sync python -m cardid.export"

[tasks.publish]
description = "Publish an exported bundle (ssh host, local directory, or github:OWNER/REPO release)."
run = "uv run --no-sync python -m cardid.publish"

[tasks.update-gallery]
description = "Refresh Scryfall metadata and missing artwork."
run = "uv run --no-sync python -m cardid.scryfall --update"

[tasks.test]
description = "Run the CPU-only unit tests."
run = "uv run --no-sync python -m unittest discover -s cardid -t ."

[tasks.setup-profiles]
description = "Create ~/.config/cardid/{manavault,the-gathering}.env from profiles/ (existing files are kept)."
run = '''
mkdir -p ~/.config/cardid
for name in manavault the-gathering; do
  target=~/.config/cardid/$name.env
  if [ -e "$target" ]; then echo "kept $target"; else install -m 600 profiles/$name.env.example "$target"; echo "created $target"; fi
done
'''

[tasks.manavault]
description = "Pull ManaVault scanner captures, fine-tune, evaluate and publish the ManaVault model."
run = "uv run --no-sync python -m cardid.retrain --env-file ~/.config/cardid/manavault.env"

[tasks.gathering]
description = "Pull table corrections, fine-tune, evaluate and publish The Gathering's model."
run = "uv run --no-sync python -m cardid.retrain --env-file ~/.config/cardid/the-gathering.env"

[tasks.retrain-all]
description = "New scans: refresh the gallery once, then pull, fine-tune, gate and publish every app's model."
run = "uv run --no-sync python -m cardid.new_set --train"

[tasks.promote-models]
description = "Copy an app's published checkpoints into models/ (default the-gathering; --profile manavault)."
run = "uv run --no-sync python -m cardid.promote"

[tasks.new-set]
description = "New set released: refresh the gallery once, then re-export and publish every app's model with it."
run = "uv run --no-sync python -m cardid.new_set"

[tasks.setup-mtgvault]
description = "Create ~/.config/cardid/mtgvault.env from profiles/ (an existing file is kept)."
run = '''
mkdir -p ~/.config/cardid
target=~/.config/cardid/mtgvault.env
if [ -e "$target" ]; then echo "kept $target"; else install -m 600 profiles/mtgvault.env.example "$target"; echo "created $target"; fi
'''

[tasks.mtgvault]
description = "Train MTG Vault's binder model: binder glare, ManaVault's detector, gate on binder photos, write to the local folder."
run = "uv run --no-sync python -m cardid.retrain --env-file ~/.config/cardid/mtgvault.env"

[tasks.compare]
description = "Compare two bundles on binder photos and synthetic binder glare (--bundle baseline --bundle candidate)."
run = "uv run --no-sync python -m cardid.compare"

[tasks.label-photos]
description = "Label phone photos of binder pages (eval only) in the capture page at http://localhost:8765."
run = "uv run --no-sync python -m cardid.capture --photos --checkpoint models/recogniser.pt --detector models/detector.pt"
